# Install only this new file; leave myforges.com and AppGallery untouched.
server {
    listen 80;
    listen [::]:80;
    server_name mastercatalog.myforges.com;
    location /.well-known/acme-challenge/ { root /var/www/mastercatalog-acme; }
    location / { return 308 https://mastercatalog.myforges.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mastercatalog.myforges.com;
    ssl_certificate /etc/letsencrypt/live/mastercatalog.myforges.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mastercatalog.myforges.com/privkey.pem;
    error_page 502 504 =503 @unavailable;
    location @unavailable {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 503 "MasterCatalog is not deployed yet.\n";
    }
    location / {
        proxy_intercept_errors on;
        proxy_pass http://127.0.0.1:28765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
